name: Scheduled X-RSS Sync

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies and run sync.py
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # non-secrets
          ITUNES_IMAGE: ${{ vars.ITUNES_IMAGE }}
          ITUNES_TITLE: ${{ vars.ITUNES_TITLE }}
          PREFIX: ${{ vars.PREFIX }}
          TWITTER_USERNAME: ${{ vars.TWITTER_USERNAME }}
        run: uv run python sync.py
